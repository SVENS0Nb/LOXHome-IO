name: Validate

permissions:
  contents: read

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - uses: "actions/checkout@v6"
        with:
          persist-credentials: false
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
