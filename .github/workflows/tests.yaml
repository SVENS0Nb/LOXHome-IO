name: Tests and security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Validate dependency resolution
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q custom_components tests
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 custom_components tests
      - name: Run regression tests
        run: pytest -q
      - name: Scan Python source
        run: |
          python -m pip install bandit
          bandit -q -lll -r custom_components/loxone

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Audit runtime dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --requirement requirements-runtime.txt
